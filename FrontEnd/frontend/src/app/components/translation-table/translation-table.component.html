<mat-card class="translation-card">
  <mat-card-content>
    <div class="toolbar">
      <mat-form-field class="search-field" appearance="outline">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Search using Translation key, original text, client projects"
        />
      </mat-form-field>

       <div
  class="import-box"
  *ngIf="isCreator()"
  (click)="openImportDialog()">

  <mat-icon>upload_file</mat-icon>
  <span>Import Keys</span>

</div>

      <div
  class="import-box"
  *ngIf="isTranslator()"
  (click)="openImportTranslationsDialog()">

  <mat-icon>upload_file</mat-icon>
  <span>Import Translations</span>
</div>

      <mat-form-field appearance="outline" class="language-select" *ngIf="isCreator()||isAdmin()||isViewer()">
        <mat-label>Language</mat-label>
        <mat-select [(ngModel)]="selectedLanguage" (selectionChange)="onLanguageChange()">
          <mat-option *ngFor="let lang of languages" [value]="lang.code">{{ lang.name }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        (click)="addNewTranslation()"
        class="add-btn"
        *ngIf="isCreator()"
      >
        <mat-icon>add</mat-icon>
        <span>Create Translation</span>
      </button>
    </div>

    <div class="table-container">
      <table
        mat-table
        [dataSource]="dataSource"
        class="translation-table"
      >
        <!-- Translation Key Column -->
        <ng-container matColumnDef="translationKey">
          <th mat-header-cell *matHeaderCellDef>Translation Key</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <input
              matInput
              type="text"
              [(ngModel)]="element.translationKey"
              (change)="updateTranslation(i, element)"
              placeholder="Enter translation key"
              class="editable-field"
              [readonly]="!canEditTranslationKey()"
              [ngClass]="{'not-allowed': !canEditTranslationKey()}"
            />
          </td>
        </ng-container>

        <!-- Original Text Column -->
        <ng-container matColumnDef="originalText">
          <th mat-header-cell *matHeaderCellDef>Original Text</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <input
              matInput
              type="text"
              [(ngModel)]="element.originalText"
              (change)="updateTranslation(i, element)"
              placeholder="Enter original text"
              class="editable-field"
               [readonly]="!canEditOriginalText()"
              [ngClass]="{'not-allowed': !canEditOriginalText()}"
            />
          </td>
        </ng-container>

        <!-- Translation Column -->
        <ng-container matColumnDef="translation">
          <th mat-header-cell *matHeaderCellDef>Translation</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <input
              matInput
              type="text"
              [(ngModel)]="element.translation"
              (ngModelChange)="markAsModified(element)"
              placeholder="Enter translation"
              class="editable-field"
              [readonly]="!canEditTranslation()"
              [ngClass]="{'not-allowed': !canEditTranslation()}"
            />
          </td>
        </ng-container>

        <!-- Tags Column -->
        <ng-container matColumnDef="tags">
          <th mat-header-cell *matHeaderCellDef>Client Project</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <span class="project-name"
            [ngClass]="{'not-allowed': !canEditTags()}">{{ getProjectName(element) }}</span>
            
          </td>
        </ng-container>

        <!-- Actions Column -->
        <!-- Actions Column -->
<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef>Actions</th>
  <td mat-cell *matCellDef="let element; let i = index">
    <!-- Delete Button - Only visible to Creator or Translator -->
    <button
      *ngIf="isCreator() || isTranslator()"
      mat-icon-button
      color="warn"
      (click)="deleteTranslation(i)"
      [matTooltip]="isCreator() ? 'Delete entire translation key' : 'Delete this translation'"
      class="delete-btn"
    >
      <mat-icon>delete</mat-icon>
    </button>

    <!-- Lock Icon - Shown when user lacks permission -->
    <mat-icon
      *ngIf="!isCreator() && !isTranslator()"
      matTooltip="You don't have permission to delete"
      class="lock-icon"
    >
      lock
    </mat-icon>
  </td>
</ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="translation-row"
        ></tr>
      </table>
    </div>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      aria-label="Select page of translations"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
