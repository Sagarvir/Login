<mat-toolbar class="header">
  <div class="toolbar-content">
    

    <div class="actions">
      <button
        mat-raised-button
        (click)="saveTranslations()"
        [disabled]="isSaving"
        class="save-btn"
      >
        <mat-icon>save</mat-icon>
        <span>{{ isSaving ? 'Saving...' : 'Save Translations' }}</span>
      </button>

      <button
        mat-raised-button
        class="save-btn"
        (click)="publishTranslations()"
      >
        <mat-icon>publish</mat-icon>
        <span>Publish All Translations</span>
      </button>

      <button
  mat-raised-button
  class="save-btn"
  color="accent"
  (click)="publishCurrentLanguage()">

  <mat-icon>publish</mat-icon>

  Publish Current Language
</button>

    </div>
  </div>
</mat-toolbar>
