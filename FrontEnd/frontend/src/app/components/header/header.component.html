<mat-toolbar class="header" *ngIf="isCreator() || isTranslator() || isAdmin()">
  <div class="toolbar-content">

    <!-- ✅ TRANSLATOR ACTIONS -->
    <div class="actions" *ngIf="isTranslator()">
      <button
        mat-raised-button
        (click)="saveTranslations()"
        [disabled]="isSaving"
        class="save-btn"
      >
        <mat-icon>save</mat-icon>
        <span>{{ isSaving ? 'Saving...' : 'Save Translations' }}</span>
      </button>
    </div>

    <!-- ✅ CREATOR / ADMIN ACTIONS -->
    <div class="actions" *ngIf="isCreator() || isAdmin()">

      <div class="file-type-container">
        <span class="file-type-title">File Type</span>

        <mat-form-field appearance="outline" class="file-type-dropdown">
          <mat-select [(value)]="selectedFileType">
            <mat-option value="both">Both Files</mat-option>
            <mat-option value="json">JSON Only</mat-option>
            <mat-option value="xlf">XLIFF Only</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <button
        mat-raised-button
        class="save-btn"
        (click)="publishTranslations()"
      >
        <mat-icon>publish</mat-icon>
        <span>Publish All Translations</span>
      </button>

      <button
        mat-raised-button
        class="save-btn"
        color="accent"
        (click)="publishCurrentLanguage()"
      >
        <mat-icon>publish</mat-icon>
        Publish Current Language
      </button>

    </div>

  </div>
</mat-toolbar>
